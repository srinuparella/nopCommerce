apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitAction-deployment
  labels:
    app: gitHub
spec:
  replicas: 3
  minReadySeconds: 5
  selector:
    matchLabels:
      app : Actions
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      name: gitAction-container
      labels:
        app: Actions
    spec:
      containers:
        - name: pod-container
          image: 934545598565.dkr.ecr.us-east-1.amazonaws.com/actions:latest
          ports:
            - containerPort: 8080
              protocol: "TCP"
          resources:
            requests:
              cpu: "800m"
              memory: "1500Mi"
            limits:
              cpu: "1800m"
              memory: "1800Mi"
          
